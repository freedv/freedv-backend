name: Build and Test
on:
  push

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  LLVM_MINGW: llvm-mingw-20260908-ucrt-ubuntu-22.04-x86_64

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        is-univ-build: [true, false]
        use-static-libressl: [false]
        include:
        # freedv-gui's macOS release build uses a static LibreSSL rather than
        # OpenSSL, so run the TLS code against it too.
        - os: macos-15
          is-univ-build: false
          use-static-libressl: true
        exclude:
        - os: ubuntu-24.04
          is-univ-build: true
        - os: ubuntu-24.04-arm
          is-univ-build: true

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Install required packages (macOS)
      if: ${{ matrix.os == 'macos-15' }}
      run: |
        brew install automake libtool

    - name: Install required packages (Linux)
      if: ${{ matrix.os != 'macos-15' }}
      run: |
        sudo apt-get update
        sudo apt-get install python3 python3-dev python3-venv

    - name: Configure Python
      run: |
        python3 -m venv rade-venv
        . ./rade-venv/bin/activate
        pip install torch matplotlib

    - name: Configure build (standard)
      if: ${{ matrix.is-univ-build == false }}
      run: |
        mkdir build
        cd build
        cmake -DRADAE_PYTHON_EXECUTABLE=${{ github.workspace }}/rade-venv/bin/python3 -DBUILD_BACKEND_UNITTESTS=1 ${{ matrix.use-static-libressl && '-DUSE_STATIC_LIBRESSL=1' || '' }} ..

    - name: Configure build (macOS universal)
      if: ${{ matrix.is-univ-build == true }}
      run: |
        mkdir build
        cd build
        cmake -DRADAE_PYTHON_EXECUTABLE=${{ github.workspace }}/rade-venv/bin/python3 -DBUILD_BACKEND_UNITTESTS=1 -DBUILD_OSX_UNIVERSAL=1 ..

    - name: Build backend and tests
      run: |
        cd build
        cmake --build .

    - name: Run tests
      run: |
        cd build
        ctest -V

  # Builds with clang source-based coverage, runs the tests and posts a
  # coverage summary on the run's summary page (HTML report as an artifact).
  coverage:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get install clang llvm python3 python3-dev python3-venv

    - name: Configure Python
      run: |
        python3 -m venv rade-venv
        . ./rade-venv/bin/activate
        pip install torch matplotlib

    - name: Configure build
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
          -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
          -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate" \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DRADAE_PYTHON_EXECUTABLE=${{ github.workspace }}/rade-venv/bin/python3 -DBUILD_BACKEND_UNITTESTS=1 ..

    - name: Build backend and tests
      run: |
        cd build
        cmake --build .

    - name: Run tests
      run: |
        cd build
        LLVM_PROFILE_FILE="${{ github.workspace }}/profiles/%p-%m.profraw" ctest --output-on-failure

    - name: Summarize coverage
      if: ${{ !cancelled() }}
      run: |
        python3 .github/scripts/coverage_summary.py build profiles coverage-html

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: coverage-html
        path: coverage-html

  # Windows: cross-compile on Linux with llvm-mingw (as freedv-gui's Windows
  # release is built), then run the tests on a real Windows machine.
  build-windows:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Install MinGW LLVM
      run: |
        wget https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/${LLVM_MINGW}.tar.xz
        tar xf ${LLVM_MINGW}.tar.xz

    - name: Configure build
      run: |
        mkdir build
        cd build
        export PATH=${{ github.workspace }}/${LLVM_MINGW}/bin:$PATH
        cmake -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cross-compile/freedv-mingw-llvm-x86_64.cmake -DBUILD_BACKEND_UNITTESTS=1 ..

    - name: Build backend and tests
      run: |
        cd build
        export PATH=${{ github.workspace }}/${LLVM_MINGW}/bin:$PATH
        cmake --build .

    - name: Collect tests and the DLLs they need
      run: |
        mkdir windows-tests
        # Only the programs ctest runs (named <module>_<program>), not other
        # executables such as the RADE text simulations, which aren't tests.
        for name in $(ctest --test-dir build --show-only=json-v1 | python3 -c 'import json, sys; [print(t["name"].split("_", 1)[1]) for t in json.load(sys.stdin)["tests"]]'); do
          exe=$(find build/src -name "$name.exe" | head -1)
          if [ -z "$exe" ]; then echo "::error::no executable for test $name"; exit 1; fi
          cp "$exe" windows-tests/
        done
        find build -name '*.dll' -not -path '*/CMakeFiles/*' -exec cp {} windows-tests/ \;
        for dll in libc++.dll libunwind.dll libwinpthread-1.dll; do
          cp ${LLVM_MINGW}/x86_64-w64-mingw32/bin/$dll windows-tests/
        done
        # Real speech for RNNoiseStepTest (see src/pipeline/test/SpeechSample.h).
        cp build/rade_src/wav/all.wav windows-tests/
        ls -l windows-tests

    - uses: actions/upload-artifact@v4
      with:
        name: windows-tests
        path: windows-tests

  test-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: windows-tests
        path: windows-tests

    - name: Run tests
      shell: pwsh
      run: |
        $failed = @()
        foreach ($test in Get-ChildItem windows-tests -Filter *.exe | Sort-Object Name) {
          Write-Host "=== $($test.Name)"
          $proc = Start-Process -FilePath $test.FullName -WorkingDirectory windows-tests -NoNewWindow -PassThru
          $null = $proc.Handle # needed for ExitCode to be available afterwards
          if (-not $proc.WaitForExit(600000)) {
            $proc.Kill()
            $failed += "$($test.Name) (timed out)"
          } elseif ($proc.ExitCode -ne 0) {
            $failed += "$($test.Name) (exit code $($proc.ExitCode))"
          }
        }
        if ($failed.Count -gt 0) {
          Write-Host "`nFailed tests:"
          $failed | ForEach-Object { Write-Host "  $_" }
          exit 1
        }
        Write-Host "`nAll tests passed."
